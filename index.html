<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GA4 Insights Dashboard powered by Gemini 2.5 Flash">
    <title>AI GA4 Insights Dashboard</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SVG Icons Placeholder from Phosphor (lightweight) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <? if (typeof HtmlService !== 'undefined') { ?>
        <style>
            <?!= include('styles.css'); ?>
        </style>
    <? } else { ?>
        <link rel="stylesheet" href="styles.css">
    <? } ?>
</head>

<body>
    <div class="dashboard-wrapper">
        <header class="header">
            <div class="logo-container">
                <i class="ph ph-chart-line-up logo-icon"></i>
                <h1>GA4 AI Automation</h1>
            </div>
            <div class="header-right">
                <span class="status-indicator">
                    <span class="dot"></span>Live Data
                </span>
                <button id="refreshDataBtn" class="refresh-btn">
                    <i class="ph ph-arrows-clockwise"></i> Refresh Insights
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Loading State -->
            <div id="loadingOverlay" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>Gemini is analyzing your data...</p>
            </div>

            <!-- Configuration & Query Section -->
            <section class="config-section glass-panel">
                <div class="config-grid">
                    <div class="input-group">
                        <label for="propertyIdInput"><i class="ph ph-hash"></i> GA4 Property ID</label>
                        <input type="text" id="propertyIdInput" placeholder="e.g., 431424603" value="431424603">
                    </div>
                    <div class="input-group">
                        <label for="questionInput"><i class="ph ph-question"></i> Ask the AI Agent</label>
                        <input type="text" id="questionInput" placeholder="e.g., What is the new user sign-up trend? (Leave empty for general audit)">
                    </div>
                    <button id="askAgentBtn" class="refresh-btn">
                        <i class="ph ph-sparkle"></i> Query Agent
                    </button>
                </div>
            </section>

            <!-- Custom AI Answer Section (Hidden by default) -->
            <section id="answerSection" class="answer-section hidden">
                <div class="card ai-card answer-card glass-panel">
                    <div class="card-header">
                        <i class="ph ph-sparkle"></i>
                        <h2 id="answerQuestionTitle">AI Agent Answer</h2>
                    </div>
                    <div id="answerContent" class="answer-content">
                        <!-- Dynamic specific answer -->
                    </div>
                </div>
            </section>


        </main>
    </div>

    <? if (typeof HtmlService !== 'undefined') { ?>
        <script>
            <?!= include('app.js'); ?>
        </script>
    <? } else { ?>
        <script src="app.js"></script>
    <? } ?>
</body>

</html>
